<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Segmentation AI System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero { background: linear-gradient(135deg, #0d6efd, #0dcaf0); color: white; padding: 40px 0; border-radius: 0 0 20px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        #results { display: none; }
        .table-responsive { max-height: 400px; overflow-y: auto; }
        th { position: sticky; top: 0; background-color: #f8f9fa; z-index: 1; }
        .badge-VIP { background-color: #ffc107; color: #000; }
        .badge-Trung { background-color: #198754; color: #fff; }
        .badge-Vang { background-color: #0dcaf0; color: #000; }
        .badge-Nguy { background-color: #dc3545; color: #fff; }
    </style>
</head>
<body>

<div class="hero text-center">
    <div class="container">
        <h1 class="display-5 fw-bold">HỆ THỐNG PHÂN LOẠI KHÁCH HÀNG AI</h1>
        <p class="lead">Dựa trên mô hình RFM & Rừng Ngẫu Nhiên (Random Forest)</p>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center mb-5">
        <div class="col-md-8">
            <div class="card p-4">
                <h4 class="mb-3 text-primary"><i class="bi bi-cloud-upload"></i> Tải lên dữ liệu lịch sử mua hàng</h4>
                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="fileInput" class="form-label text-muted">Hỗ trợ định dạng: .CSV, .XLS, .XLSX (Phải chứa các cột: CustomerID, InvoiceDate, Quantity, UnitPrice)</label>
                        <input class="form-control form-control-lg" type="file" id="fileInput" name="file" accept=".csv, .xls, .xlsx" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold" id="submitBtn">
                        <span id="spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        Chạy Mô Hình Phân Loại
                    </button>
                </form>
                <div id="errorAlert" class="alert alert-danger mt-3 d-none"></div>
            </div>
        </div>
    </div>

    <!-- Kết quả -->
    <div id="results">
        <div class="row mb-4">
            <!-- Biểu đồ Chart.js -->
            <div class="col-md-5">
                <div class="card p-4 h-100">
                    <h5 class="text-center text-primary mb-4">Tỷ lệ Phân khúc Khách hàng</h5>
                    <div style="position: relative; height: 300px; width: 100%;">
                        <canvas id="segmentChart"></canvas>
                    </div>
                    <p class="text-center mt-3 fw-bold text-success" id="totalCustomers"></p>
                </div>
            </div>
            
            <!-- Bảng dữ liệu -->
            <div class="col-md-7">
                <div class="card p-4 h-100">
                    <h5 class="text-primary mb-4">Danh sách Khách hàng phân loại (Top 50)</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Mã KH</th>
                                    <th>Recency (Ngày)</th>
                                    <th>Frequency (Đơn)</th>
                                    <th>Monetary (£)</th>
                                    <th>Phân Khúc</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let myChart = null;

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const fileInput = document.getElementById('fileInput');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const errorAlert = document.getElementById('errorAlert');
        const resultsDiv = document.getElementById('results');
        
        if (!fileInput.files[0]) return;

        // UI Loading state
        submitBtn.disabled = true;
        spinner.classList.remove('d-none');
        errorAlert.classList.add('d-none');
        resultsDiv.style.display = 'none';

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (data.error) {
                errorAlert.textContent = data.error;
                errorAlert.classList.remove('d-none');
            } else {
                displayResults(data);
            }
        } catch (err) {
            errorAlert.textContent = 'Đã xảy ra lỗi kết nối đến server!';
            errorAlert.classList.remove('d-none');
        } finally {
            submitBtn.disabled = false;
            spinner.classList.add('d-none');
        }
    });

    function displayResults(data) {
        document.getElementById('results').style.display = 'block';
        document.getElementById('totalCustomers').textContent = `Tổng số khách hàng hợp lệ: ${data.total_customers.toLocaleString()}`;

        // Cập nhật biểu đồ Chart.js
        const ctx = document.getElementById('segmentChart').getContext('2d');
        const labels = Object.keys(data.stats);
        const values = Object.values(data.stats);
        
        // Cấu hình màu cho từng cụm
        const colors = labels.map(label => {
            if(label.includes('VIP')) return '#ffc107';
            if(label.includes('Trung Thành')) return '#198754';
            if(label.includes('Vãng Lai')) return '#0dcaf0';
            return '#dc3545'; // Nguy cơ
        });

        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: values,
                    backgroundColor: colors,
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });

        // Cập nhật bảng
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        data.customers.forEach(cus => {
            let badgeClass = 'bg-secondary';
            if(cus.Segment.includes('VIP')) badgeClass = 'badge-VIP';
            else if(cus.Segment.includes('Trung Thành')) badgeClass = 'badge-Trung';
            else if(cus.Segment.includes('Vãng Lai')) badgeClass = 'badge-Vang';
            else badgeClass = 'badge-Nguy';

            const row = `<tr>
                <td class="fw-bold text-muted">${cus.CustomerID}</td>
                <td>${cus.Recency}</td>
                <td>${cus.Frequency}</td>
                <td>${cus.Monetary.toLocaleString()}</td>
                <td><span class="badge ${badgeClass} px-2 py-1 rounded-pill">${cus.Segment}</span></td>
            </tr>`;
            tbody.insertAdjacentHTML('beforeend', row);
        });
    }
</script>
</body>
</html>
