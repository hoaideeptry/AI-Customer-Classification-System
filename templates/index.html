<!doctype html>
<html lang="vi" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app_title">RFM Intelligence | Customer Segmentation AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <!-- Thư viện đồ họa & xử lý dữ liệu Client-side -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="admin-layout" id="adminApp">
    
    <!-- Component 1: Sidebar & Topbar điều hướng -->
    {% include 'components/navbar.html' %}

    <!-- Khung nội dung chính bên phải -->
    <div class="admin-main">
      <main class="admin-body">
        <div class="tab-content" id="adminTabContent">
          
          <!-- Component 2: Tab Tải lên & Khớp Dữ Liệu (Data Mapper UI) -->
          {% include 'components/tab_upload.html' %}

          <!-- Component 3: Tab Bảng Nhật ký Hoạt động (Audit Logs) -->
          {% include 'components/tab_logs.html' %}

          <!-- Component 4: Tab Bảng Điều Khiển (Dashboard Phân Cụm & What-If) -->
          {% include 'components/tab_dashboard.html' %}

        </div>
      </main>
    </div>
  </div>

  <!-- Component 5: Modal Thông Tin Đồ Án -->
  {% include 'components/modal_info.html' %}

  <!-- Thư viện hỗ trợ -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <!-- Module Ứng dụng: i18n -> ui.js -> api.js -->
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
</body>
</html>
